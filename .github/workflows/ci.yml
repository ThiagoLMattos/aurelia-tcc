name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Firestore emulator is a Java program.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache the Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # shared, mobile and the tracker simulator's scenarios
      - run: npm test
      # the API, against the Auth and Firestore emulators
      - run: npm run test:api

  docker:
    name: API image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aurelia-api .

  audit:
    name: Dependency audit (API, production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # New advisories appear without any change here, so this reports but does not block a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --workspace @aurelia/api --audit-level=high
