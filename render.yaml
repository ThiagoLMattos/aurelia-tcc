# Render Blueprint for the Aurélia API, on Render's free plan (no card needed).
#
# Render → New → Blueprint → this repository. It asks for the `sync: false` values once, at creation:
#   FIREBASE_PROJECT_ID        the Firebase project id
#   FIREBASE_SERVICE_ACCOUNT   the whole JSON of a key from Firebase console → Project settings →
#                              Service accounts → Generate new private key
#   GROQ_API_KEY               from console.groq.com/keys
# JOBS_TOKEN is generated by Render; copy it from the service's Environment page into the two
# cron-job.org jobs, which call the jobs and keep the free instance from sleeping:
#   POST <url>/api/v1/internal/jobs/run        every 5 minutes, header X-Jobs-Token: <JOBS_TOKEN>
#   POST <url>/api/v1/internal/jobs/escalate   every minute,    header X-Jobs-Token: <JOBS_TOKEN>
# Without Twilio, SMS are only logged (SMS_PROVIDER=log). To send them, set SMS_PROVIDER=twilio and the
# three TWILIO_* variables on the service's Environment page.
services:
  - type: web
    name: aurelia-api
    runtime: docker
    plan: free
    # The closest Render region to Brazil.
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    # Redeploy on every commit to main (PRs are checked by CI before merging), and only for changes
    # the API is built from.
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - Dockerfile
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: USE_EMULATORS
        value: 'false'
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: JOBS_TOKEN
        generateValue: true
      # The jobs are called from outside (cron-job.org): a free instance may sleep or restart.
      - key: SCHEDULER_ENABLED
        value: 'false'
      # Render's proxy sits in front of the container; needed for the per-IP rate limits.
      - key: TRUST_PROXY
        value: '1'
      # The mobile app is not a browser; leave empty unless a web client is added.
      - key: CORS_ORIGINS
        value: ''
      - key: SMS_PROVIDER
        value: log
